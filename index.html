<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title data-i18n-title="appTitle">Artillery Distance Calculator</title>
    <meta
      name="description"
      data-i18n-content="metaDescription"
      content="Static distance and azimuth calculator for WARDOGS coordinates."
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <div class="top-controls">
          <p class="eyebrow" data-i18n="eyebrow"></p>
          <label class="lang-switch">
            <span id="languageLabel" data-i18n="languageLabel"></span>
            <select id="languageSelect" aria-label="Language / Sprache">
              <option value="en">English</option>
              <option value="de">Deutsch</option>
            </select>
          </label>
        </div>
        <h1 data-i18n="appTitle"></h1>
        <p id="heroDescription" data-i18n="heroDescription"></p>
      </header>

      <main class="container">
        <section class="card">
          <h2 data-i18n="sectionPoints"></h2>
          <p class="note copy-hint" data-i18n-html="copyHint"></p>
          <div class="grid card-grid-top">
            <div class="point-row">
              <div class="point-label" data-i18n="ownPositionLabel"></div>
              <div class="coord-field">
                <span class="coord-axis">x</span>
                <input
                  id="gunX"
                  type="number"
                  inputmode="decimal"
                  placeholder="98.43"
                  step="0.01"
                  data-i18n-placeholder="inputPlaceholderOwnX"
                  aria-label="Own x"
                />
              </div>
              <div class="coord-field">
                <span class="coord-axis">y</span>
                <input
                  id="gunY"
                  type="number"
                  inputmode="decimal"
                  placeholder="110.38"
                  step="0.01"
                  data-i18n-placeholder="inputPlaceholderOwnY"
                  aria-label="Own y"
                />
              </div>
              <button id="pasteGunBtn" class="paste-btn" type="button">
                <span data-i18n="pasteOwnBtn"></span>
              </button>
            </div>
            <div class="point-row">
              <div class="point-label" data-i18n="enemyPositionLabel"></div>
              <div class="coord-field">
                <span class="coord-axis">x</span>
                <input
                  id="targetX"
                  type="number"
                  inputmode="decimal"
                  placeholder="108.90"
                  step="0.01"
                  data-i18n-placeholder="inputPlaceholderTargetX"
                  aria-label="Enemy x"
                />
              </div>
              <div class="coord-field">
                <span class="coord-axis">y</span>
                <input
                  id="targetY"
                  type="number"
                  inputmode="decimal"
                  placeholder="112.50"
                  step="0.01"
                  data-i18n-placeholder="inputPlaceholderTargetY"
                  aria-label="Enemy y"
                />
              </div>
              <button id="pasteTargetBtn" class="paste-btn" type="button">
                <span data-i18n="pasteEnemyBtn"></span>
              </button>
            </div>
          </div>
          <div class="actions">
            <button id="resetBtn" type="button" class="ghost">
              <span data-i18n="resetBtn"></span>
            </button>
          </div>
        </section>

        <section class="card">
          <h2 data-i18n="sectionResult"></h2>
          <div class="result-grid">
            <div><span data-i18n="resultDistance"></span><strong id="distanceKm">—</strong></div>
            <div><span data-i18n="resultAzimuth"></span><strong id="azimuth">—</strong></div>
          </div>
          <p id="rangeMessage" class="note" data-i18n="statusReady"></p>
        </section>

        <section class="card card--wide">
          <h2 data-i18n="sectionNotes"></h2>
          <ul>
            <li>
              <span data-i18n="noteMethod"></span>
            </li>
            <li>
              <span data-i18n="noteUseInGame"></span>
            </li>
            <li>
              <a id="repoLink" href="https://github.com/Gamewalker/wardogs-artillery-calculator" target="_blank" rel="noopener noreferrer"></a>
            </li>
            <li>
              <a id="videoLink" href="https://youtu.be/9X8U-eHCMgI?is=m-4F3UgNOu2_LIki" target="_blank" rel="noopener noreferrer"></a>
            </li>
          </ul>
        </section>
      </main>
    </div>

    <script src="./calculator.js" defer></script>
  </body>
</html>
